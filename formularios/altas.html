<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contactos altos</title>
</head>
<body>
    <form action="../php/insert.php" method="post">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="fNombre" required>
        </div>

        <div class="mb-3">
            <label for="alias" class="form-label">Alias</label>
            <input type="text" class="form-control" id="alias" name="fAlias" required>
        </div>
        
        <div class="mb-3">
            <label for="edad" class="form-label">Edad</label>
            <input type="Number" class="form-control" id="edad" name="fEdad" required>
        </div>

        <button type="submit" class="btn-solid theme-primary">Insertar</button>
    </form>
</body>
</html>
